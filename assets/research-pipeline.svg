<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#111C2E"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#1B2635" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .box   { opacity: 0; animation: pop .6s ease-out forwards; }
    .b1 { animation-delay: .10s } .b2 { animation-delay: .45s } .b3 { animation-delay: .80s }
    .b4 { animation-delay: 1.15s } .b5 { animation-delay: 1.50s }
    .chev { opacity: 0; animation: fade .5s ease-out forwards; }
    .c1 { animation-delay: .38s } .c2 { animation-delay: .73s } .c3 { animation-delay: 1.08s } .c4 { animation-delay: 1.43s }
    .metric { opacity: 0; animation: fade .7s ease-out forwards; animation-delay: 1.9s; }
    .flow  { stroke-dasharray: 10 14; animation: dash 2.4s linear infinite; }
    .pulse { animation: breathe 3s ease-in-out infinite; }
    .title { animation: fade .8s ease-out both; }
    @keyframes pop  { from { opacity:0; transform: translateY(14px) } to { opacity:1; transform: translateY(0) } }
    @keyframes fade { from { opacity:0 } to { opacity:1 } }
    @keyframes dash { to { stroke-dashoffset: -48 } }
    @keyframes breathe { 0%,100% { opacity:.35 } 50% { opacity:1 } }
  </style>

  <rect width="880" height="330" rx="16" fill="url(#bg)"/>
  <rect width="880" height="330" rx="16" fill="url(#grid)" opacity=".55"/>
  <rect x="1" y="1" width="878" height="328" rx="16" fill="none" stroke="#1F2A3C"/>

  <g class="title">
    <circle cx="34" cy="40" r="5" fill="#5EEAD4" class="pulse"/>
    <text x="50" y="45" fill="#E6EDF7" font-size="17" font-weight="700">Architectural Complexity vs. Performance</text>
    <text x="50" y="66" fill="#7D8DA5" font-size="12">Brain Tumour MRI Classification · BRISC 2025 · 4 classes · stratified 5-fold CV</text>
  </g>

  <line x1="34" y1="140" x2="846" y2="140" stroke="url(#rail)" stroke-width="2" opacity=".28"/>
  <line x1="34" y1="140" x2="846" y2="140" stroke="url(#rail)" stroke-width="2" class="flow" opacity=".9"/>

  <g class="box b1">
    <rect x="24" y="110" width="150" height="62" rx="10" fill="#0F1929" stroke="#38BDF8" stroke-width="1.4"/>
    <text x="99" y="134" fill="#38BDF8" font-size="10" text-anchor="middle" opacity=".8">STAGE 01</text>
    <text x="99" y="153" fill="#E6EDF7" font-size="12" font-weight="600" text-anchor="middle">EfficientNet-B0</text>
  </g>
  <g class="box b2">
    <rect x="196" y="110" width="150" height="62" rx="10" fill="#0F1929" stroke="#22D3EE" stroke-width="1.4"/>
    <text x="271" y="134" fill="#22D3EE" font-size="10" text-anchor="middle" opacity=".8">STAGE 02</text>
    <text x="271" y="153" fill="#E6EDF7" font-size="12" font-weight="600" text-anchor="middle">DenseNet201</text>
  </g>
  <g class="box b3">
    <rect x="368" y="110" width="150" height="62" rx="10" fill="#0F1929" stroke="#5EEAD4" stroke-width="1.4"/>
    <text x="443" y="130" fill="#5EEAD4" font-size="10" text-anchor="middle" opacity=".8">STAGE 03</text>
    <text x="443" y="147" fill="#E6EDF7" font-size="12" font-weight="600" text-anchor="middle">Dual-Backbone</text>
    <text x="443" y="162" fill="#E6EDF7" font-size="12" font-weight="600" text-anchor="middle">Fusion</text>
  </g>
  <g class="box b4">
    <rect x="540" y="110" width="150" height="62" rx="10" fill="#0F1929" stroke="#818CF8" stroke-width="1.4"/>
    <text x="615" y="130" fill="#818CF8" font-size="10" text-anchor="middle" opacity=".8">STAGE 04</text>
    <text x="615" y="147" fill="#E6EDF7" font-size="12" font-weight="600" text-anchor="middle">CBAM + Cross-</text>
    <text x="615" y="162" fill="#E6EDF7" font-size="12" font-weight="600" text-anchor="middle">Attention</text>
  </g>
  <g class="box b5">
    <rect x="712" y="110" width="150" height="62" rx="10" fill="#0F1929" stroke="#A78BFA" stroke-width="1.4"/>
    <text x="787" y="130" fill="#A78BFA" font-size="10" text-anchor="middle" opacity=".8">STAGE 05</text>
    <text x="787" y="147" fill="#E6EDF7" font-size="12" font-weight="600" text-anchor="middle">CNN – Swin</text>
    <text x="787" y="162" fill="#E6EDF7" font-size="12" font-weight="600" text-anchor="middle">Transformer</text>
  </g>

  <g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path class="chev c1" d="M178 134l10 7-10 7" stroke="#22D3EE"/>
    <path class="chev c2" d="M350 134l10 7-10 7" stroke="#5EEAD4"/>
    <path class="chev c3" d="M522 134l10 7-10 7" stroke="#818CF8"/>
    <path class="chev c4" d="M694 134l10 7-10 7" stroke="#A78BFA"/>
  </g>

  <g class="metric">
    <rect x="24" y="206" width="196" height="60" rx="10" fill="#0E1626" stroke="#1F2A3C"/>
    <text x="122" y="230" fill="#7D8DA5" font-size="10" text-anchor="middle">MAX TEST AUC</text>
    <text x="122" y="252" fill="#5EEAD4" font-size="18" font-weight="700" text-anchor="middle" filter="url(#glow)">0.9998</text>

    <rect x="234" y="206" width="196" height="60" rx="10" fill="#0E1626" stroke="#1F2A3C"/>
    <text x="332" y="230" fill="#7D8DA5" font-size="10" text-anchor="middle">INSERTION AUC</text>
    <text x="332" y="252" fill="#38BDF8" font-size="18" font-weight="700" text-anchor="middle">0.856 – 0.878</text>

    <rect x="444" y="206" width="196" height="60" rx="10" fill="#0E1626" stroke="#1F2A3C"/>
    <text x="542" y="230" fill="#7D8DA5" font-size="10" text-anchor="middle">WILCOXON SIGNED-RANK</text>
    <text x="542" y="252" fill="#A78BFA" font-size="18" font-weight="700" text-anchor="middle">p ≥ 0.0625</text>

    <rect x="654" y="206" width="202" height="60" rx="10" fill="#0E1626" stroke="#1F2A3C"/>
    <text x="755" y="230" fill="#7D8DA5" font-size="10" text-anchor="middle">EXPLAINABILITY</text>
    <text x="755" y="252" fill="#22D3EE" font-size="14" font-weight="700" text-anchor="middle">Grad-CAM++ · Rollout</text>
  </g>

  <g class="metric">
    <circle cx="34" cy="294" r="4" fill="#F0B429"/>
    <text x="48" y="298" fill="#8B98AC" font-size="11.5">Verdict — added architectural complexity produced no statistically significant gain: performance saturation.</text>
  </g>
</svg>
